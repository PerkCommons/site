name: Site CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: PerkCommons/data
          ref: 6bff01c334cfef390180aaa729d24613866dbd35
          path: .data
      - name: Verify canonical data snapshot
        working-directory: .data
        run: test "$(git rev-parse HEAD)" = "6bff01c334cfef390180aaa729d24613866dbd35"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate canonical data snapshot
        working-directory: .data
        run: |
          npm ci
          npm test
          npm run coverage
          npm run migrate:v2
          set +e
          npm run audit:sources -- --as-of 2026-10-05
          audit_exit=$?
          set -e
          npm run reports -- --as-of 2026-10-05
          node -e "const fs=require('node:fs'); for (const p of ['reports/migration-results.json','reports/data-quality.json','reports/source-audit.json']) { const j=JSON.parse(fs.readFileSync(p,'utf8')); console.log(p, JSON.stringify({asOf:j.asOf,recordsInspected:j.recordsInspected,recordsValid:j.recordsValid,recordsFailed:j.recordsFailed,urlsInspected:j.urlsInspected,counts:j.counts,metrics:j.metrics},null,2)); }"
          git status --short
          node ../scripts/verify-source-audit.mjs "$audit_exit" reports/source-audit.json
      - name: Upload release data reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perkcommons-data-release-reports
          path: |
            .data/reports/*.json
            .data/reports/*.md
          if-no-files-found: error
      - name: Restore canonical data snapshot for site build
        working-directory: .data
        run: |
          git reset --hard 6bff01c334cfef390180aaa729d24613866dbd35
          git clean -fd
          test "$(git rev-parse HEAD)" = "6bff01c334cfef390180aaa729d24613866dbd35"
          test -z "$(git status --porcelain)"
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
          PUBLIC_SUPABASE_URL: https://example.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-publishable-key
      - run: npm run audit:site
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data