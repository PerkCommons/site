name: Production release

on:
  workflow_dispatch:
    inputs:
      data_sha:
        description: Exact commit from PerkCommons/data
        required: true
        type: string
      schema_version:
        description: Expected schema version
        required: true
        default: "1+2.0"
        type: string
      taxonomy_version:
        description: Expected taxonomy version
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: perkcommons-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact data release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: PerkCommons/data
          ref: ${{ inputs.data_sha }}
          path: .data
          persist-credentials: false

      - name: Verify immutable release inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ inputs.data_sha }}" =~ ^[0-9a-fA-F]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git -C .data rev-parse HEAD)" = "${{ inputs.data_sha }}"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Run unit and contract tests
        run: npm test
        env:
          PUBLIC_SUPABASE_URL: https://example.invalid
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          PUBLIC_TURNSTILE_SITE_KEY: placeholder

      - name: Build exact release candidate
        run: npm run build
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
          PERKCOMMONS_DATA_REF: ${{ inputs.data_sha }}
          PERKCOMMONS_DATA_SHA: ${{ inputs.data_sha }}
          PERKCOMMONS_SITE_SHA: ${{ github.sha }}
          PERKCOMMONS_RELEASE_CANDIDATE: "1"
          PUBLIC_SITE_URL: https://perkcommons.com
          PUBLIC_SUPABASE_URL: https://example.invalid
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          PUBLIC_TURNSTILE_SITE_KEY: placeholder

      - name: Verify release metadata and static assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/data/opportunities.json
          test -f dist/catalog-index.json
          test -f dist/sitemap-index.xml
          grep -q '${{ inputs.data_sha }}' dist/data/opportunities.json
          grep -q '"schemaVersion":"${{ inputs.schema_version }}"' dist/data/opportunities.json
          grep -q '"taxonomyVersion":"${{ inputs.taxonomy_version }}"' dist/data/opportunities.json

      - name: Audit built site
        run: npm run audit:site

      - name: Verify Cloudflare package
        run: npx wrangler deploy --dry-run --outdir .wrangler/release-dry-run

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser regression tests
        run: npm run test:browser
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out site release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact data release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: PerkCommons/data
          ref: ${{ inputs.data_sha }}
          path: .data
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install site dependencies
        run: npm ci

      - name: Build production artifact
        run: npm run build
        env:
          PERKCOMMONS_DATA_REPOSITORY_PATH: ${{ github.workspace }}/.data
          PERKCOMMONS_DATA_REF: ${{ inputs.data_sha }}
          PERKCOMMONS_DATA_SHA: ${{ inputs.data_sha }}
          PERKCOMMONS_SITE_SHA: ${{ github.sha }}
          PERKCOMMONS_RELEASE_CANDIDATE: "1"
          PUBLIC_SITE_URL: https://perkcommons.com
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Deploy tested artifact to Cloudflare Workers
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record Cloudflare deployment
        run: npx wrangler deployments list --name perkcommons-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
